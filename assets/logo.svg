<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" role="img" aria-label="ASRS Analytics">
  <defs>
    <linearGradient id="logoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E4D72"/>
      <stop offset="100%" stop-color="#0E1A2B"/>
    </linearGradient>
  </defs>
  <!-- Tile con monograma -->
  <rect x="0" y="0" width="64" height="64" rx="12" ry="12" fill="url(#logoBg)"/>
  <rect x="10" y="50" width="14" height="3" rx="1.5" fill="#18B6C9"/>
  <text x="32" y="40"
        text-anchor="middle"
        font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif"
        font-weight="700"
        font-size="22"
        letter-spacing="-0.5"
        fill="#FFFFFF">AR</text>
  <!-- Wordmark -->
  <text x="80" y="34"
        font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif"
        font-weight="700"
        font-size="22"
        letter-spacing="-0.5"
        fill="#0F1722">ASRS</text>
  <text x="80" y="52"
        font-family="'IBM Plex Mono', 'Consolas', monospace"
        font-weight="500"
        font-size="12"
        letter-spacing="2"
        fill="#667085">ANALYTICS</text>
</svg>
